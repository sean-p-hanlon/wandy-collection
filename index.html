<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The WANDY Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #89CFF0;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url("new-york-mets-logo-transparent.png");
    background-repeat: repeat;
    background-size: 150px 150px;
    background-position: center;
    opacity: 0.12;
    z-index: -1;
    pointer-events: none;
}

/* =========================================================
   NAVIGATION BUTTONS
========================================================= */

.top-buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 12px 10px 8px;
}

.top-button a {
    display: inline-block;
    background: #002D72;
    color: #FFFFFF;
    text-decoration: none;
    font-family: "Barlow Condensed", Arial, sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 22px;
    border-radius: 25px;
    border: 2px solid #FFFFFF;
    box-shadow:
        3px 3px 0 #FF5910,
        5px 5px 0 rgba(0,0,0,0.25);
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.top-button a:hover {
    transform: translateY(-2px);
    box-shadow:
        4px 4px 0 #FF5910,
        6px 6px 0 rgba(0,0,0,0.25);
}

.top-button a:active {
    transform: translateY(2px);
    box-shadow: 1px 1px 0 #FF5910;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    text-align: center;
    padding: 25px 15px 10px;
}

.header h1 {
    margin: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #FF5910;
    -webkit-text-stroke: 2px #FFFFFF;
    text-shadow:
        3px 3px 0 #002D72,
        5px 5px 0 rgba(0,0,0,0.25);
}

.header p {
    color: #000;
    margin-top: 8px;
}

/* =========================================================
   CAROUSEL
========================================================= */

.carousel-container {
    width: 100%;
    overflow: hidden;
    position: relative;
    padding: 20px 0 0;
}

.carousel {
    position: relative;
    height: 430px;
    width: 100%;
}

/* =========================================================
   CARDS
========================================================= */

.card {
    position: absolute;
    top: 10px;
    width: 280px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    transition:
        left 0.35s ease,
        transform 0.35s ease,
        opacity 0.35s ease;
    box-shadow:
        0 15px 35px rgba(0,0,0,0.5);
    background: #222;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card.center {
    left: 50%;
    transform:
        translateX(-50%)
        scale(1);
    opacity: 1;
    z-index: 5;
}

.card.left {
    left: calc(50% - 390px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

.card.right {
    left: calc(50% + 110px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

.card.hidden {
    left: 50%;
    transform:
        translateX(-50%)
        scale(0.5);
    opacity: 0;
    z-index: 1;
}

/* =========================================================
   WANDY BATTING IMAGE
========================================================= */

.wandy-batting {
    text-align: center;
    margin-top: 0;
    margin-bottom: 5px;
}

.wandy-batting img {
    width: 90px;
    max-width: 60%;
    height: 90px;
    display: inline-block;
    transition: opacity 0.2s ease;
}

/* =========================================================
   CARD INFORMATION
========================================================= */

.info {
    text-align: center;
    margin-top: 5px;
    padding: 0 15px;
}

.info h2 {
    margin: 0;
    font-size: 22px;
    color: #000;
}

.info p {
    color: #000;
    margin: 8px 0;
    font-size: 17px;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

button {
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

/* =========================================================
   DOTS
========================================================= */

.dots {
    text-align: center;
    margin-top: 20px;
    color: #000;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .top-buttons {
        gap: 10px;
    }

    .top-button a {
        font-size: 18px;
        padding: 7px 16px;
    }

    .header {
        padding-top: 20px;
    }

    .header h1 {
        font-size: 40px;
        letter-spacing: 1px;
        -webkit-text-stroke: 1.5px #FFFFFF;
        text-shadow:
            2px 2px 0 #002D72,
            3px 3px 0 rgba(0,0,0,0.25);
    }

    .carousel {
        height: 350px;
    }

    .card {
        width: 230px;
        height: 330px;
    }

    .card.left {
        left: calc(50% - 270px);
        transform: scale(0.75);
    }

    .card.right {
        left: calc(50% + 40px);
        transform: scale(0.75);
    }

    .card.center {
        left: 50%;
    }

    body::before {
        background-size: 120px 120px;
        opacity: 0.10;
    }
}

</style>

</head>

<body>

<!-- =======================================================
     NAVIGATION
======================================================== -->

<div class="top-buttons">

    <div class="top-button">
        <a href="cardvault.html">
            WANDY Card Vault
        </a>
    </div>

    <div class="top-button">
        <a href="about/about.html">
            Parallels I Need
        </a>
    </div>

</div>

<!-- =======================================================
     HEADER
======================================================== -->

<div class="header">

    <h1>The WANDY Collection</h1>

    <p id="collectionCount"></p>

</div>

<!-- =========================================================
     CAROUSEL
========================================================= -->

<div class="carousel-container">

    <div
        class="carousel"
        id="carousel"
    >
        <!-- Cards are automatically created below -->
    </div>

</div>

<!-- =========================================================
     WANDY BATTING IMAGE
========================================================= -->

<div class="wandy-batting">

    <img
        id="wandyBattingImage"
        src="wandybatting.png"
        alt="Wandy Asigen batting"
    >

</div>

<!-- =========================================================
     CARD INFORMATION
========================================================= -->

<div class="info">

    <h2 id="playerName">
        Wandy Asigen
    </h2>

    <p id="cardDescription"></p>

</div>

<!-- =========================================================
     NAVIGATION BUTTONS
========================================================= -->

<div class="controls">

    <button id="previous">
        ‹
    </button>

    <button id="next">
        ›
    </button>

</div>

<!-- =========================================================
     DOTS
========================================================= -->

<div
    class="dots"
    id="dots"
></div>

<script>

/* =========================================================
   CARD DATA
========================================================= */

const cardData = [

    {
        image: "goldminidiamondauto.jpeg",
        parallel: "Gold Mini-Diamond Auto # to 50"
    },

    {
        image: "truegreenauto.png",
        parallel: "True Green Auto # to 99"
    },

    {
        image: "greenlavaauto.jpeg",
        parallel: "Green Lava Auto # to 99"
    },

     {
        image: "greenreptilianauto.jpeg",
        parallel: "Green Reptilian Auto # to 99"
    },
    
    {
        image: "bluereptilianauto.jpeg",
        parallel: "Blue Reptilian Auto # to 150"
    },

    {
        image: "trueblueauto.jpeg",
        parallel: "Blue Auto # to 150"
    },

    {
        image: "purplerefractorauto.jpeg",
        parallel: "Purple Auto # to 250"
    },

    {
        image: "refractorauto.jpeg",
        parallel: "Refractor Auto # to 499"
    },

    {
        image: "baseauto.jpeg",
        parallel: "Base Auto"
    },

    {
        image: "geometric.jpeg",
        parallel: "Geometric Refractor # to 499"
    },

    {
        image: "specklerefractor.jpeg",
        parallel: "Speckle Refractor # to 299"
    },

    {
        image: "purplepulsar.jpeg",
        parallel: "Purple Pulsar Refractor # to 250"
    },

    {
        image: "purpleshimmer.jpeg",
        parallel: "Purple Shimmer Refractor # to 250"
    },

    {
        image: "purplewave.jpeg",
        parallel: "Purple Wave Refractor # to 250"
    },

    {
        image: "purplegeometric.jpeg",
        parallel: "Purple Geometric Refractor # to 250"
    },

    {
        image: "truepurplerefractor.jpeg",
        parallel: "True Purple Refractor # to 250"
    },

    {
        image: "fuschiashimmer.jpeg",
        parallel: "Fuschia Shimmer Refractor # to 199"
    },

    {
        image: "truebluerefractor.jpeg",
        parallel: "True Blue Refractor # to 150"
    },

    {
        image: "bluegeometric.jpeg",
        parallel: "Blue Geometric Refractor # to 150"
    },

    {
        image: "aquapulsarrefractor.jpeg",
        parallel: "Aqua Pulsar Refractor # to 125"
    },

    {
        image: "wave.jpeg",
        parallel: "Wave Refractor # to 100"
    },

    {
        image: "greenreptilian.jpeg",
        parallel: "Green Reptilian Refractor # to 99"
    },

    {
        image: "yellowgeometric.jpeg",
        parallel: "Yellow Geometric Refractor # to 75"
    },

    {
        image: "trueyellow.jpeg",
        parallel: "True Yellow Refractor # to 75"
    },

    {
        image: "goldshimmer.jpeg",
        parallel: "Gold Shimmer Refractor # to 50"
    },

    {
        image: "orangereptilian.jpeg",
        parallel: "Orange Reptilian Refractor # to 25"
    },

    {
        image: "xfractor.jpeg",
        parallel: "X-Fractor"
    },

    {
        image: "mojorefractor.jpeg",
        parallel: "Mojo Refractor"
    },

    {
        image: "lazer.jpeg",
        parallel: "Lazer Refractor"
    },

    {
        image: "base.jpeg",
        parallel: "Base Card"
    }
,
    {
        image: "redspotlight.jpeg",
        parallel: "Bowman Spotlights Red Refractor # to 5"
    }


];

/* =========================================================
   WANDY BATTING IMAGES 
========================================================= */

const wandyBattingImages = [
    "wandybatting.png",
    "wandybatting2.png",
    "wandybatting3.png",
    "wandybatting4.png"
];

/* =========================================================
   CREATE CARDS
========================================================= */

const carousel =
    document.getElementById("carousel");

cardData.forEach((cardInfo) => {

    const card =
        document.createElement("div");

    card.className = "card";

    const image =
        document.createElement("img");

    image.src = cardInfo.image;

    image.alt =
        "Wandy Asigen - " +
        cardInfo.parallel;

    card.appendChild(image);

    carousel.appendChild(card);

});

/* =========================================================
   GET ELEMENTS
========================================================= */

const cards =
    document.querySelectorAll(".card");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const playerName =
    document.getElementById("playerName");

const cardDescription =
    document.getElementById("cardDescription");

const collectionCount =
    document.getElementById("collectionCount");

const wandyBattingImage =
    document.getElementById("wandyBattingImage");

let currentIndex = 0;

/* =========================================================
   COLLECTION COUNT
========================================================= */

collectionCount.textContent =
    "Parallel Counter: " +
    cardData.length;

/* =========================================================
   UPDATE CAROUSEL
========================================================= */

function updateCarousel() {

    cards.forEach((card, index) => {

        card.className = "card";

        let difference =
            index - currentIndex;

        if (
            difference >
            cards.length / 2
        ) {
            difference -= cards.length;
        }

        if (
            difference <
            -cards.length / 2
        ) {
            difference += cards.length;
        }

        if (difference === 0) {

            card.classList.add("center");

        }

        else if (difference === -1) {

            card.classList.add("left");

        }

        else if (difference === 1) {

            card.classList.add("right");

        }

        else {

            card.classList.add("hidden");

        }

    });

    playerName.textContent =
        "Wandy Asigen";

    cardDescription.textContent =
        cardData[currentIndex].parallel;

    const battingImageIndex =
        currentIndex %
        wandyBattingImages.length;

    wandyBattingImage.src =
        wandyBattingImages[battingImageIndex];

    wandyBattingImage.alt =
        "Wandy Asigen batting - image " +
        (battingImageIndex + 1);

    updateDots();
}

/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextCard() {

    currentIndex++;

    if (
        currentIndex >=
        cards.length
    ) {
        currentIndex = 0;
    }

    updateCarousel();
}

function previousCard() {

    currentIndex--;

    if (
        currentIndex < 0
    ) {
        currentIndex =
            cards.length - 1;
    }

    updateCarousel();
}

/* =========================================================
   BUTTON EVENTS
========================================================= */

nextButton.addEventListener(
    "click",
    nextCard
);

previousButton.addEventListener(
    "click",
    previousCard
);

/* =========================================================
   SWIPE SUPPORT
========================================================= */

let startX = 0;
let endX = 0;

carousel.addEventListener(
    "touchstart",
    function(event) {

        startX =
            event.touches[0].clientX;

    }
);

carousel.addEventListener(
    "touchend",
    function(event) {

        endX =
            event.changedTouches[0].clientX;

        const distance =
            startX - endX;

        if (distance > 50) {
            nextCard();
        }

        if (distance < -50) {
            previousCard();
        }

    }
);

/* =========================================================
   DOTS
========================================================= */

function updateDots() {

    const dots =
        document.getElementById("dots");

    dots.textContent = "";

    for (
        let i = 0;
        i < cards.length;
        i++
    ) {

        if (
            i === currentIndex
        ) {

            dots.textContent += "● ";

        }

        else {

            dots.textContent += "○ ";

        }

    }

}

/* =========================================================
   START
========================================================= */

updateCarousel();

</script>

</body>
</html>
