<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The WANDY Collection</title>

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #89CFF0;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
}


/* =========================================================
   REPEATING METS LOGO BACKGROUND
========================================================= */

body::before {

    content: "";

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    background-image: url("new-york-mets-logo-transparent.png");

    background-repeat: repeat;

    background-size: 150px 150px;

    background-position: center;

    opacity: 0.12;

    z-index: -1;

    pointer-events: none;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    text-align: center;

    padding: 25px 15px 10px;

}

.header h1 {

    margin: 0;

    font-size: 28px;

    letter-spacing: 1px;

}

.header p {

    color: #000;

    margin-top: 8px;

}


/* =========================================================
   CAROUSEL CONTAINER
========================================================= */

.carousel-container {

    width: 100%;

    overflow: hidden;

    position: relative;

    padding: 40px 0;

}

.carousel {

    position: relative;

    height: 520px;

    width: 100%;

}


/* =========================================================
   CARDS
========================================================= */

.card {

    position: absolute;

    top: 10px;

    width: 280px;

    height: 400px;

    border-radius: 14px;

    overflow: hidden;

    transition:
        left 0.35s ease,
        transform 0.35s ease,
        opacity 0.35s ease;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.5);

    background: #222;

}

.card img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}


/* =========================================================
   CENTER CARD
========================================================= */

.card.center {

    left: 50%;

    transform:
        translateX(-50%)
        scale(1);

    opacity: 1;

    z-index: 5;

}


/* =========================================================
   LEFT CARD
========================================================= */

.card.left {

    left: calc(50% - 390px);

    transform: scale(0.78);

    opacity: 0.65;

    z-index: 3;

}


/* =========================================================
   RIGHT CARD
========================================================= */

.card.right {

    left: calc(50% + 110px);

    transform: scale(0.78);

    opacity: 0.65;

    z-index: 3;

}


/* =========================================================
   HIDDEN CARDS
========================================================= */

.card.hidden {

    left: 50%;

    transform:
        translateX(-50%)
        scale(0.5);

    opacity: 0;

    z-index: 1;

}


/* =========================================================
   WANDY BATTING IMAGE
========================================================= */

.wandy-batting {
    text-align: center;
    margin-top: -5px;
    margin-bottom: 5px;
}

.wandy-batting img {
    width: 180px;
    max-width: 60%;
    height: auto;
    display: inline-block;
}


/* =========================================================
   CARD INFORMATION
========================================================= */

.info {
    text-align: center;
    margin-top: 5px;
    padding: 0 15px;
}

.info h2 {

    margin: 0;

    font-size: 22px;

    color: #000;

}

.info p {

    color: #000;

    margin: 8px 0;

    font-size: 17px;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-top: 20px;

}

button {

    background: #222;

    color: white;

    border: 1px solid #555;

    border-radius: 50%;

    width: 50px;

    height: 50px;

    font-size: 22px;

    cursor: pointer;

}

button:hover {

    background: #333;

}


/* =========================================================
   DOTS
========================================================= */

.dots {

    text-align: center;

    margin-top: 20px;

    color: #000;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .carousel {

        height: 450px;

    }

    .card {

        width: 230px;

        height: 330px;

    }

    .card.left {

        left: calc(50% - 270px);

        transform: scale(0.75);

    }

    .card.right {

        left: calc(50% + 40px);

        transform: scale(0.75);

    }

    .card.center {

        left: 50%;

    }

    body::before {

        background-size: 120px 120px;

        opacity: 0.10;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<div class="header">

    <h1>The WANDY Collection</h1>

    <p id="collectionCount"></p>

</div>


<!-- =======================================================
     CAROUSEL
======================================================== -->

<div class="carousel-container">

    <div
        class="carousel"
        id="carousel"
    >

        <!-- Cards are automatically created below -->

    </div>

</div>


</div>


<!-- =======================================================
     WANDY BATTING IMAGE
======================================================== -->

<div class="wandy-batting">

    <img
        src="wandybatting.png"
        alt="Wandy Asigen batting"
    >

</div>


<!-- =======================================================
     CARD INFORMATION
======================================================== -->

<div class="info">

    <h2 id="playerName">
        Wandy Asigen
    </h2>

    <p id="cardDescription"></p>

</div>


<!-- =======================================================
     NAVIGATION BUTTONS
======================================================== -->

<div class="controls">

    <button id="previous">
        ‹
    </button>

    <button id="next">
        ›
    </button>

</div>


<!-- =======================================================
     DOTS
======================================================== -->

<div
    class="dots"
    id="dots"
></div>


<script>


/* =========================================================
   CARD DATA
=========================================================

   TO ADD A NEW CARD:

   1. Put the image in the same folder as index.html
   2. Copy one of the entries below
   3. Change the image filename
   4. Change the parallel name

========================================================= */

const cardData = [

    {
        image: "truegreenauto.png",
        parallel: "True Green Auto # to 99"
    },

    {
        image: "greenlavaauto.jpeg",
        parallel: "Green Lava Auto # to 99"
    },

    {
        image: "baseauto.jpeg",
        parallel: "Base Auto"
    },

    {
        image: "geometric.jpeg",
        parallel: "Geometric Refractor # to 499"
    },

    {
        image: "purplepulsar.jpeg",
        parallel: "Purple Pulsar Refractor # to 250"
    },

    {
        image: "purplegeometric.jpeg",
        parallel: "Purple Geometric Refractor # to 250"
    },

    {
        image: "wave.jpeg",
        parallel: "Wave Refractor # to 100"
    },

    {
        image: "yellowgeometric.jpeg",
        parallel: "Yellow Geometric Refractor # to 75"
    },

    {
        image: "trueyellow.jpeg",
        parallel: "True Yellow Refractor # to 75"
    },

    {
        image: "goldshimmer.jpeg",
        parallel: "Gold Shimmer Refractor # to 50"
    },

    {
        image: "xfractor.jpeg",
        parallel: "X-Fractor"
    },

    {
        image: "mojorefractor.jpeg",
        parallel: "Mojo Refractor"
    },

    {
        image: "lazer.jpeg",
        parallel: "Lazer Refractor"
    },

    {
        image: "base.jpeg",
        parallel: "Base Card"
    }

];


/* =========================================================
   CREATE CARDS
========================================================= */

const carousel =
    document.getElementById("carousel");


cardData.forEach((cardInfo) => {

    const card =
        document.createElement("div");

    card.className = "card";


    const image =
        document.createElement("img");


    image.src =
        cardInfo.image;


    image.alt =
        "Wandy Asigen - " +
        cardInfo.parallel;


    card.appendChild(image);


    carousel.appendChild(card);

});


/* =========================================================
   GET ELEMENTS
========================================================= */

const cards =
    document.querySelectorAll(".card");


const previousButton =
    document.getElementById("previous");


const nextButton =
    document.getElementById("next");


const playerName =
    document.getElementById("playerName");


const cardDescription =
    document.getElementById("cardDescription");


const collectionCount =
    document.getElementById("collectionCount");


let currentIndex = 0;


/* =========================================================
   COLLECTION COUNT
========================================================= */

collectionCount.textContent =
    cardData.length +
    " Total Parallels as of 9/25/2026";


/* =========================================================
   UPDATE CAROUSEL
========================================================= */

function updateCarousel() {


    cards.forEach((card, index) => {


        card.className =
            "card";


        let difference =
            index - currentIndex;


        /* Wrap around */

        if (
            difference >
            cards.length / 2
        ) {

            difference -=
                cards.length;

        }


        if (
            difference <
            -cards.length / 2
        ) {

            difference +=
                cards.length;

        }


        /* CENTER */

        if (difference === 0) {

            card.classList.add(
                "center"
            );

        }


        /* LEFT */

        else if (difference === -1) {

            card.classList.add(
                "left"
            );

        }


        /* RIGHT */

        else if (difference === 1) {

            card.classList.add(
                "right"
            );

        }


        /* HIDDEN */

        else {

            card.classList.add(
                "hidden"
            );

        }

    });


    /* Update card information */

    playerName.textContent =
        "Wandy Asigen";


    cardDescription.textContent =
        cardData[currentIndex].parallel;


    /* Update dots */

    updateDots();

}


/* =========================================================
   NEXT CARD
========================================================= */

function nextCard() {

    currentIndex++;


    if (
        currentIndex >=
        cards.length
    ) {

        currentIndex = 0;

    }


    updateCarousel();

}


/* =========================================================
   PREVIOUS CARD
========================================================= */

function previousCard() {

    currentIndex--;


    if (currentIndex < 0) {

        currentIndex =
            cards.length - 1;

    }


    updateCarousel();

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

nextButton.addEventListener(
    "click",
    nextCard
);


previousButton.addEventListener(
    "click",
    previousCard
);


/* =========================================================
   SWIPE SUPPORT
========================================================= */

let startX = 0;

let endX = 0;


carousel.addEventListener(
    "touchstart",
    function(event) {

        startX =
            event.touches[0].clientX;

    }
);


carousel.addEventListener(
    "touchend",
    function(event) {

        endX =
            event.changedTouches[0].clientX;


        const distance =
            startX - endX;


        /* Swipe left */

        if (distance > 50) {

            nextCard();

        }


        /* Swipe right */

        if (distance < -50) {

            previousCard();

        }

    }
);


/* =========================================================
   DOTS
========================================================= */

function updateDots() {

    const dots =
        document.getElementById("dots");


    dots.textContent = "";


    for (
        let i = 0;
        i < cards.length;
        i++
    ) {


        if (
            i === currentIndex
        ) {

            dots.textContent +=
                "● ";

        }

        else {

            dots.textContent +=
                "○ ";

        }

    }

}


/* =========================================================
   START
========================================================= */

updateCarousel();


</script>


</body>

</html>
