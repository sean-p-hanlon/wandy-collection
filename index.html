<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wandy Collection</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #89CFF0;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.header {
    text-align: center;
    padding: 25px 15px 10px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
}

.header p {
    color: #000;
    margin-top: 8px;
}

.carousel-container {
    width: 100%;
    overflow: hidden;
    position: relative;
    padding: 40px 0;
}

.carousel {
    position: relative;
    height: 520px;
    width: 100%;
}

.card {
    position: absolute;
    top: 10px;
    width: 280px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    transition:
        left 0.35s ease,
        transform 0.35s ease,
        opacity 0.35s ease;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    background: #222;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* CENTER CARD */

.card.center {
    left: 50%;
    transform: translateX(-50%) scale(1);
    opacity: 1;
    z-index: 5;
}

/* LEFT CARD */

.card.left {
    left: calc(50% - 390px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

/* RIGHT CARD */

.card.right {
    left: calc(50% + 110px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

/* HIDDEN CARDS */

.card.hidden {
    left: 50%;
    transform: translateX(-50%) scale(0.5);
    opacity: 0;
    z-index: 1;
}

/* CARD INFORMATION */

.info {
    text-align: center;
    margin-top: 10px;
    padding: 0 15px;
}

.info h2 {
    margin: 0;
    font-size: 22px;
    color: #000;
}

.info p {
    color: #000;
    margin: 8px 0;
    font-size: 17px;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

button {
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

/* DOTS */

.dots {
    text-align: center;
    margin-top: 20px;
    color: #000;
}

/* MOBILE */

@media (max-width: 600px) {

    .carousel {
        height: 450px;
    }

    .card {
        width: 230px;
        height: 330px;
    }

    .card.left {
        left: calc(50% - 270px);
        transform: scale(0.75);
    }

    .card.right {
        left: calc(50% + 40px);
        transform: scale(0.75);
    }

    .card.center {
        left: 50%;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>The WANDY Collection</h1>

    <p id="collectionCount"></p>

</div>


<div class="carousel-container">

    <div class="carousel" id="carousel">
        <!-- Cards are automatically created from cardData below -->
    </div>

</div>


<div class="info">

    <h2 id="playerName">Wandy Asigen</h2>

    <p id="cardDescription"></p>

</div>


<div class="controls">

    <button id="previous">‹</button>

    <button id="next">›</button>

</div>


<div class="dots" id="dots"></div>


<script>

/*
==========================================================
CARD DATA
==========================================================

THIS IS THE MAIN SECTION YOU WILL EDIT AS YOUR COLLECTION
GROWS.

To add a new card, copy one of the entries and change:

image
parallel

Example:

{
    image: "newcard.jpeg",
    parallel: "Blue Auto #/150"
},

Make sure the image file is in the SAME folder as index.html.
==========================================================
*/

const cardData = [

    {
        image: "truegreenauto.png",
        parallel: "True Green Auto #/99"
    },

    {
        image: "greenlavaauto.jpeg",
        parallel: "Green Lava Auto #/99"
    },

    {
        image: "baseauto.jpeg",
        parallel: "Base Auto"
    },

    {
        image: "geometric.jpeg",
        parallel: "Geometric #/499"
    },

    {
        image: "purplepulsar.jpeg",
        parallel: "Purple Pulsar #/250"
    },

    {
        image: "purplegeometric.jpeg",
        parallel: "Purple Geometric #/250"
    },

    {
        image: "wave.jpeg",
        parallel: "Wave Refractor #/100"
    },

    {
        image: "yellowgeometric.jpeg",
        parallel: "Yellow Geometric #/75"
    },

    {
        image: "trueyellow.jpeg",
        parallel: "True Yellow #/75"
    },

    {
        image: "goldshimmer.jpeg",
        parallel: "Gold Shimmer #/50"
    },

    {
        image: "xfractor.jpeg",
        parallel: "X-Fractor"
    },

    {
        image: "mojorefractor.jpeg",
        parallel: "Mojo Refractor"
    },

    {
        image: "lazer.jpeg",
        parallel: "Lazer"
    },

    {
        image: "base.jpeg",
        parallel: "Base"
    }

];


/*
==========================================================
AUTOMATICALLY CREATE THE CARDS
==========================================================
*/

const carousel = document.getElementById("carousel");

cardData.forEach((cardInfo) => {

    const card = document.createElement("div");

    card.className = "card";

    const image = document.createElement("img");

    image.src = cardInfo.image;

    image.alt =
        "Wandy Asigen - " +
        cardInfo.parallel;

    card.appendChild(image);

    carousel.appendChild(card);

});


/*
==========================================================
GET CARDS
==========================================================
*/

const cards = document.querySelectorAll(".card");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const playerName =
    document.getElementById("playerName");

const cardDescription =
    document.getElementById("cardDescription");

const collectionCount =
    document.getElementById("collectionCount");

let currentIndex = 0;


/*
==========================================================
COLLECTION COUNT
==========================================================
*/

collectionCount.textContent =
    cardData.length +
    " Total Parallels as of 9/25/2026";


/*
==========================================================
UPDATE CAROUSEL
==========================================================
*/

function updateCarousel() {

    cards.forEach((card, index) => {

        card.className = "card";

        let difference =
            index - currentIndex;


        /*
        Wrap around when moving
        from the first/last card.
        */

        if (difference > cards.length / 2) {

            difference -= cards.length;

        }


        if (difference < -cards.length / 2) {

            difference += cards.length;

        }


        /*
        CENTER CARD
        */

        if (difference === 0) {

            card.classList.add("center");

        }


        /*
        CARD TO THE LEFT
        */

        else if (difference === -1) {

            card.classList.add("left");

        }


        /*
        CARD TO THE RIGHT
        */

        else if (difference === 1) {

            card.classList.add("right");

        }


        /*
        ALL OTHER CARDS
        */

        else {

            card.classList.add("hidden");

        }

    });


    /*
    UPDATE CARD INFORMATION
    */

    playerName.textContent =
        "Wandy Asigen";


    cardDescription.textContent =
        cardData[currentIndex].parallel;


    /*
    UPDATE DOTS
    */

    updateDots();

}


/*
==========================================================
NEXT CARD
==========================================================
*/

function nextCard() {

    currentIndex++;

    if (currentIndex >= cards.length) {

        currentIndex = 0;

    }

    updateCarousel();

}


/*
==========================================================
PREVIOUS CARD
==========================================================
*/

function previousCard() {

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex = cards.length - 1;

    }

    updateCarousel();

}


/*
==========================================================
BUTTONS
==========================================================
*/

nextButton.addEventListener(
    "click",
    nextCard
);

previousButton.addEventListener(
    "click",
    previousCard
);


/*
==========================================================
SWIPING
==========================================================
*/

let startX = 0;

let endX = 0;


carousel.addEventListener(
    "touchstart",
    function(event) {

        startX =
            event.touches[0].clientX;

    }
);


carousel.addEventListener(
    "touchend",
    function(event) {

        endX =
            event.changedTouches[0].clientX;


        let distance =
            startX - endX;


        /*
        SWIPE LEFT
        */

        if (distance > 50) {

            nextCard();

        }


        /*
        SWIPE RIGHT
        */

        if (distance < -50) {

            previousCard();

        }

    }
);


/*
==========================================================
DOTS
==========================================================
*/

function updateDots() {

    const dots =
        document.getElementById("dots");


    dots.textContent = "";


    for (
        let i = 0;
        i < cards.length;
        i++
    ) {

        if (i === currentIndex) {

            dots.textContent += "● ";

        }

        else {

            dots.textContent += "○ ";

        }

    }

}


/*
==========================================================
START
==========================================================
*/

updateCarousel();

</script>

</body>
</html>
