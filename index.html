<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Wandy Collection</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #89CFF0;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.header {
    text-align: center;
    padding: 25px 15px 10px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 1px;
}

.header p {
    color: #000;
    margin-top: 8px;
}

.carousel-container {
    width: 100%;
    overflow: hidden;
    position: relative;
    padding: 40px 0;
}

.carousel {
    position: relative;
    height: 520px;
    width: 100%;
}

.card {
    position: absolute;
    top: 10px;
    width: 280px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    transition:
        left 0.35s ease,
        transform 0.35s ease,
        opacity 0.35s ease;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    background: #222;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* CENTER CARD */

.card.center {
    left: 50%;
    transform: translateX(-50%) scale(1);
    opacity: 1;
    z-index: 5;
}

/* LEFT CARD */

.card.left {
    left: calc(50% - 390px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

/* RIGHT CARD */

.card.right {
    left: calc(50% + 110px);
    transform: scale(0.78);
    opacity: 0.65;
    z-index: 3;
}

/* CARDS FARTHER AWAY */

.card.hidden {
    left: 50%;
    transform: translateX(-50%) scale(0.5);
    opacity: 0;
    z-index: 1;
}

.info {
    text-align: center;
    margin-top: 10px;
}

.info h2 {
    margin: 0;
    font-size: 22px;
}

.info p {
    color: #aaa;
    margin: 8px 0;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

button {
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 22px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.dots {
    text-align: center;
    margin-top: 20px;
    color: #777;
}

/* MOBILE */

@media (max-width: 600px) {

    .carousel {
        height: 450px;
    }

    .card {
        width: 230px;
        height: 330px;
    }

    .card.left {
        left: calc(50% - 270px);
        transform: scale(0.75);
    }

    .card.right {
        left: calc(50% + 40px);
        transform: scale(0.75);
    }

    .card.center {
        left: 50%;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>The WANDY Collection</h1>

    <p>14 Total Parallels as of 9/25/2026</p>

</div>


<div class="carousel-container">

    <div class="carousel" id="carousel">

       <div class="card">
    <img src="truegreenauto.png">
</div>

         <div class="card">
    <img src="greenlavaauto.jpeg">
</div>
        
        <div class="card">
            <img src="baseauto.jpeg">
        </div>

        <div class="card">
            <img src="geometric.jpeg">
        </div>

        <div class="card">
            <img src="purplepulsar.jpeg">
        </div>

        <div class="card">
            <img src="purplegeometric.jpeg">
        </div>

        <div class="card">
            <img src="wave.jpeg">
        </div>

        <div class="card">
            <img src="yellowgeometric.jpeg">
        </div>

        <div class="card">
            <img src="trueyellow.jpeg">
        </div>

        <div class="card">
            <img src="goldshimmer.jpeg">
        </div>

        <div class="card">
            <img src="xfractor.jpeg">
        </div>

        <div class="card">
            <img src="mojorefractor.jpeg">
        </div>

        <div class="card">
            <img src="lazer.jpeg">
        </div>

        <div class="card">
            <img src="base.jpeg">
        </div>

    </div>

</div>


<div class="info">

    <h2 id="playerName">Card 1</h2>

    <p id="cardDescription">
        Your sports card collection
    </p>

</div>


<div class="controls">

    <button id="previous">‹</button>

    <button id="next">›</button>

</div>


<div class="dots" id="dots"></div>


<script>

const cards = document.querySelectorAll(".card");

const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");

const playerName = document.getElementById("playerName");
const cardDescription = document.getElementById("cardDescription");

let currentIndex = 0;


/* UPDATE CAROUSEL */

function updateCarousel() {

    cards.forEach((card, index) => {

        card.className = "card";

        let difference = index - currentIndex;

        /*
        If we move beyond the last card,
        wrap back to the beginning.
        */

        if (difference > cards.length / 2) {
            difference -= cards.length;
        }

        if (difference < -cards.length / 2) {
            difference += cards.length;
        }


        if (difference === 0) {

            card.classList.add("center");

        } else if (difference === -1) {

            card.classList.add("left");

        } else if (difference === 1) {

            card.classList.add("right");

        } else {

            card.classList.add("hidden");

        }

    });


    playerName.textContent =
        "Card " + (currentIndex + 1);

    cardDescription.textContent =
        "Sports card " +
        (currentIndex + 1) +
        " of " +
        cards.length;


    updateDots();

}


/* NEXT CARD */

function nextCard() {

    currentIndex++;

    if (currentIndex >= cards.length) {
        currentIndex = 0;
    }

    updateCarousel();

}


/* PREVIOUS CARD */

function previousCard() {

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = cards.length - 1;
    }

    updateCarousel();

}


/* BUTTONS */

nextButton.addEventListener("click", nextCard);

previousButton.addEventListener("click", previousCard);


/* SWIPING */

let startX = 0;
let endX = 0;


document.getElementById("carousel")
.addEventListener("touchstart", function(event) {

    startX = event.touches[0].clientX;

});


document.getElementById("carousel")
.addEventListener("touchend", function(event) {

    endX = event.changedTouches[0].clientX;

    let distance = startX - endX;


    if (distance > 50) {

        nextCard();

    }


    if (distance < -50) {

        previousCard();

    }

});


/* DOTS */

function updateDots() {

    const dots = document.getElementById("dots");

    dots.textContent = "";

    for (let i = 0; i < cards.length; i++) {

        if (i === currentIndex) {

            dots.textContent += "● ";

        } else {

            dots.textContent += "○ ";

        }

    }

}


/* START */

updateCarousel();

</script>

</body>
</html>
